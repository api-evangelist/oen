aid: oen
name: OEN
description: 'Oen (應援科技) is a Taiwan-based fintech company operating an integrated
  payments and CRM cloud platform. It provides multi-channel payment processing (credit
  cards, convenience-store payments, bank transfers, and subscriptions), electronic
  invoicing, and a supporter-relationship CRM covering event and ticketing management,
  member and volunteer management, merchandise/reward redemption, and email/SMS communications.
  The platform serves nonprofits, political organizations, educational institutions,
  entertainment events, and commercial merchants, with more than 600 organizations
  and individuals using Oen. The company runs an API Gateway and mobile-payment surface,
  a public responsible-disclosure and bug-bounty program, and displays PCI DSS Level 1,
  ISO 27001, and ISO 27701 trust badges.'
